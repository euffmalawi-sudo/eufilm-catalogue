<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EU Film Festival Malawi 2026</title>
  <style>
    /* ---------- DARK THEME WITH GOLD ACCENTS ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0e1a;
      color: #e8edf5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    /* HEADER */
    .header {
      background: linear-gradient(145deg, #0d1b3e, #1a2a5e);
      padding: 30px 20px 25px;
      border-radius: 16px;
      text-align: center;
      border-bottom: 5px solid #ffd700;
      margin-bottom: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    .festival-logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 12px;
      border-radius: 12px;
    }

    .header h1 {
      font-size: 2.6rem;
      letter-spacing: 1px;
    }
    .header h1 span {
      color: #ffd700;
    }
    .header p {
      font-size: 1.2rem;
      opacity: 0.85;
      margin-top: 6px;
      color: #b0c4de;
    }

    /* TOOLBAR (filters & sort) */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      background: #111b33;
      padding: 16px 24px;
      border-radius: 40px;
      margin-bottom: 35px;
      border: 1px solid #2a3a6a;
    }
    .toolbar div {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbar label {
      color: #b0c4de;
      font-weight: 600;
    }
    .toolbar select {
      background: #1a2540;
      color: #e8edf5;
      border: 1px solid #3a4a7a;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.95rem;
      cursor: pointer;
      min-width: 130px;
    }
    .toolbar select:focus {
      outline: 2px solid #ffd700;
      border-color: transparent;
    }

    /* FILM GRID */
    #filmGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 28px;
      margin-top: 10px;
    }

    /* FILM CARD */
    .film-card {
      background: #1a2540;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #2a3a6a;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    .film-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 35px rgba(255, 215, 0, 0.15);
      border-color: #ffd700;
    }
    .film-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      background: #0d1b3e;
    }
    .film-card .film-title {
      color: #ffd700;
      font-size: 1.2rem;
      padding: 12px 16px 4px;
    }
    .film-card .film-director {
      padding: 0 16px;
      font-size: 0.95rem;
      color: #b0c4de;
    }
    .film-card .film-year {
      padding: 0 16px 10px;
      font-size: 0.85rem;
      color: #7a8ab0;
    }
    .details-btn {
      margin: 8px 16px 16px;
      padding: 10px 0;
      background: transparent;
      border: 2px solid #ffd700;
      color: #ffd700;
      font-weight: 700;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
    }
    .details-btn:hover {
      background: #ffd700;
      color: #0a0e1a;
    }

    /* MODAL */
    .modal-container {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-body {
      background: #111b33;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px 35px;
      border-radius: 24px;
      border: 1px solid #ffd700;
      box-shadow: 0 20px 60px rgba(255, 215, 0, 0.2);
      position: relative;
    }
    .modal-body::-webkit-scrollbar {
      width: 6px;
    }
    .modal-body::-webkit-scrollbar-track {
      background: #0d1b3e;
      border-radius: 10px;
    }
    .modal-body::-webkit-scrollbar-thumb {
      background: #ffd700;
      border-radius: 10px;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 20px;
      font-size: 2.4rem;
      background: none;
      border: none;
      color: #b0c4de;
      cursor: pointer;
      transition: 0.2s;
    }
    .modal-close:hover {
      color: #ffd700;
      transform: rotate(90deg);
    }
    .modal-content h2 {
      color: #ffd700;
      font-size: 2rem;
      margin-bottom: 12px;
      border-bottom: 2px solid #2a3a6a;
      padding-bottom: 10px;
    }
    .modal-content p {
      margin: 8px 0;
      line-height: 1.6;
      color: #d0ddf0;
    }
    .modal-content p strong {
      color: #ffd700;
    }
    .trailer-link {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 28px;
      border-radius: 40px;
      font-weight: 700;
      text-decoration: none;
      transition: 0.2s;
      background: #2a3a6a;
      color: #e8edf5;
    }
    .trailer-link:hover {
      background: #3a4a8a;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .header h1 { font-size: 1.8rem; }
      .festival-logo { max-width: 130px; }
      .toolbar { flex-direction: column; align-items: stretch; border-radius: 20px; }
      .toolbar div { justify-content: space-between; }
      .modal-body { padding: 20px; margin: 10px; }
    }
    /* NEW: Day Grouping Styles */
.day-section {
  margin-bottom: 48px;
}
.day-header {
  font-size: 1.8rem;
  color: #ffd700;
  border-bottom: 3px solid #2a3a6a;
  padding-bottom: 12px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  justify-content: space-between;
}
.day-header .date-badge {
  background: #ffd700;
  color: #0a0e1a;
  font-size: 0.9rem;
  padding: 4px 16px;
  border-radius: 30px;
  font-weight: 700;
  white-space: nowrap;
}
.film-grid-inner {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 28px;
}
/* Override the old grid to allow block layout for sections */
#filmGrid {
  display: block;
}

/* NEW: Embedded Video Trailer */
.video-wrapper {
  position: relative;
  padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
  height: 0;
  overflow: hidden;
  margin: 16px 0 20px 0;
  border-radius: 12px;
  background: #000;
}
.video-wrapper iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* NEW: Book Now Button */
.booking-btn {
  display: inline-block;
  margin-top: 10px;
  padding: 12px 32px;
  background: #ffd700;
  color: #0a0e1a;
  border-radius: 40px;
  font-weight: 700;
  text-decoration: none;
  transition: 0.2s;
  border: none;
  cursor: pointer;
  font-size: 1rem;
}
.booking-btn:hover {
  background: #ffed4a;
  transform: scale(1.02);
}
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER WITH LOGO -->
  <header class="header">
    <img src="euro-flim-1-1024x574.jpg" alt="EU Film Festival Logo" class="festival-logo" />
    <h1>🇪🇺 EU <span>Film Festival</span> Malawi</h1>
    <p>12 – 19 September 2026 • Blantyre &amp; Lilongwe</p>
  </header>

  <!-- TOOLBAR (Filters + Sort) -->
  <div class="toolbar">
    <div>
      <label for="filterCountry">🌍 Country</label>
      <select id="filterCountry">
        <option value="all">All</option>
      </select>
    </div>
    <div>
      <label for="filterDay">📅 Day</label>
      <select id="filterDay">
        <option value="all">All</option>
      </select>
    </div>
    <div>
      <label for="sortBy">🔀 Sort</label>
      <select id="sortBy">
        <option value="title">Title A–Z</option>
        <option value="year">Year (Newest)</option>
      </select>
    </div>
  </div>

  <!-- FILM GRID -->
  <div id="filmGrid"></div>

  <!-- MODAL CONTAINER -->
  <div id="modalContainer" class="modal-container">
    <div id="modalBody" class="modal-body">
      <button id="closeModalBtn" class="modal-close">&times;</button>
    </div>
  </div>

</div>

<!-- SCRIPTS -->
<script type="module" src="./js/app.js"></script>
</body>
</html>
