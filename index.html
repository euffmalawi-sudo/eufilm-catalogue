<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EU Film Festival – Catalogue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/cards.css">
</head>
<body>
    <header class="catalogue-header">
        <div class="logo-wrapper">
            <img src="https://europeanfilmfestival.eu/wp-content/uploads/2024/03/logo-nero.webp" alt="Logo" onerror="this.style.display='none'">
            <div class="logo-divider"></div>
            <div class="festival-name">European Film <span>Festival</span></div>
        </div>
        <div class="subtitle"><i class="fas fa-map-pin"></i> Malawi · Catalogue <i class="fas fa-map-pin"></i></div>
        <div class="header-stats">
            <span class="stat-item"><i class="fas fa-film"></i> Total: <span id="totalCount">0</span></span>
            <span class="stat-item"><i class="fas fa-check-circle" style="color:#0c6b3b;"></i> Green: <span id="greenCount">0</span></span>
            <span class="stat-item"><i class="fas fa-clock" style="color:#8a6d1b;"></i> Review: <span id="yellowCount">0</span></span>
        </div>
    </header>

    <div class="controls-bar">
        <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search by title, director, or country...">
        </div>
        <div class="filter-group">
            <select id="eventFilter">
                <option value="all">All Events</option>
                <option value="Opening Night">Opening Night</option>
                <option value="Family Day">Family Day</option>
                <option value="Public Screening">Public Screening</option>
                <option value="Industry Day">Industry Day</option>
            </select>
            <select id="genreFilter">
                <option value="all">All Genres</option>
            </select>
            <select id="sortFilter">
                <option value="combined">Sort: Top Rated</option>
                <option value="title">Sort: A-Z</option>
                <option value="year">Sort: Newest</option>
                <option value="runtime">Sort: Shortest</option>
            </select>
        </div>
    </div>

    <div id="catalogueGrid" class="film-grid"></div>
    <div id="noResults" style="display:none; text-align:center; padding:4rem; color:#6e7892;">
        <i class="fas fa-film" style="font-size:3rem; margin-bottom:1rem;"></i>
        <p>No films match your criteria.</p>
    </div>

    <div id="modalContainer" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <button class="modal-close" id="closeModalBtn"><i class="fas fa-times"></i></button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
