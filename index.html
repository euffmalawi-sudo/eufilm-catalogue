<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EU Film Festival Malawi – Book Now</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/cards.css">
    <style>
        /* Additional date‑selector styles */
        .date-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .date-btn {
            background: var(--eff-off-white);
            border: 2px solid rgba(209,209,209,0.3);
            border-radius: 40px;
            padding: 0.6rem 1.8rem;
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--eff-navy);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .date-btn:hover {
            background: var(--eff-white);
            border-color: var(--eff-red);
        }
        .date-btn.active {
            background: var(--eff-red);
            color: white;
            border-color: var(--eff-red);
            box-shadow: 0 4px 12px rgba(221,0,63,0.25);
        }
        .date-btn .venue-badge {
            font-weight: 400;
            font-size: 0.7rem;
            opacity: 0.7;
            display: block;
            margin-top: 0.1rem;
        }
        .date-btn.active .venue-badge {
            opacity: 0.9;
        }

        .film-grid .card-booking {
            margin-top: 0.8rem;
            text-align: center;
        }
        .booking-btn-sm {
            display: inline-block;
            background: var(--eff-red);
            color: white;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.1s ease;
            width: 100%;
            box-sizing: border-box;
        }
        .booking-btn-sm:hover {
            background: var(--eff-red-dark);
            transform: scale(1.02);
        }

        /* Ensure modal booking button is visible */
        .modal-booking {
            margin: 1rem 0 0.5rem 0;
            text-align: center;
        }
        .modal-booking .booking-btn-lg {
            display: inline-block;
            background: var(--eff-red);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.6rem 2.5rem;
            border-radius: 40px;
            text-decoration: none;
            transition: background 0.2s ease;
            border: 2px solid var(--eff-red);
        }
        .modal-booking .booking-btn-lg:hover {
            background: var(--eff-red-dark);
            border-color: var(--eff-red-dark);
        }
    </style>
</head>
<body>

    <div class="guide-container">

        <!-- Header -->
        <header class="catalogue-header">
            <div class="logo-wrapper">
                <img src="https://europeanfilmfestival.eu/wp-content/uploads/2024/03/logo-nero.webp" alt="Logo" onerror="this.style.display='none'">
                <div class="logo-divider"></div>
                <div class="festival-name">European Film <span>Festival</span></div>
            </div>
            <div class="subtitle"><i class="fas fa-map-pin"></i> Malawi · Book Your Seat <i class="fas fa-map-pin"></i></div>
            <div class="header-stats">
                <span class="stat-item"><i class="fas fa-calendar-day"></i> <span id="dayCount">0</span> days</span>
                <span class="stat-item"><i class="fas fa-film"></i> <span id="filmCount">0</span> films</span>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav-bar">
            <a href="index.html" class="active">Catalogue</a>
            <a href="program.html">Program</a>
        </nav>

        <!-- Date Selector -->
        <div class="date-selector" id="dateSelector"></div>

        <!-- Film Grid -->
        <div id="catalogueGrid" class="film-grid"></div>
        <div id="noResults" style="display:none; text-align:center; padding:4rem; color:#6e7892;">
            <i class="fas fa-film" style="font-size:3rem; margin-bottom:1rem;"></i>
            <p>No films available for this day.</p>
        </div>

        <!-- Modal -->
        <div id="modalContainer" class="modal-overlay" style="display:none;">
            <div class="modal-content">
                <button class="modal-close" id="closeModalBtn"><i class="fas fa-times"></i></button>
                <div id="modalBody"></div>
            </div>
        </div>

    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
